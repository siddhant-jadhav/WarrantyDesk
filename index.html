<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WarrantyDesk — Customer App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

</svg>

<div class="stage" id="stage" data-view="demo">
  <aside class="presenter" id="presenter" aria-label="Demo controls"></aside>

  <main class="main">
    <div class="device-area" id="device-area">
      <div class="device-holder" id="device-holder">
        <div class="device">
          <div class="device-screen" id="device-screen">
            <div class="app" id="app"></div>
            <div class="toast-layer" id="toast-layer" aria-live="polite"></div>
            <div class="island" aria-hidden="true"></div>
            <div class="home-ind" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <section class="overview" id="overview" aria-label="All screens"></section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
